root:
  items:
    - type: stacking-context
      bounds: [0, 0, 1000, 1000]
      items:
        - type: box-shadow
          bounds: [ 20, 20, 80, 80 ]
          color: blue
          clip-mode: inset
          spread-radius: 10
          border-radius: [ 20, 20, 20, 20, 1.2, -0.7, -Inf, 8.0 ]

        - type: box-shadow
          bounds: [ 120, 20, 80, 80 ]
          color: blue
          clip-mode: inset
          spread-radius: 10
          border-radius: [ 25, 25, 25, 25, 1.2, -0.7, -Inf, 8.0 ]

        - type: box-shadow
          bounds: [ 220, 20, 80, 80 ]
          color: blue
          clip-mode: inset
          spread-radius: 10
          border-radius: [ 10, 10, 10, 10, 1.2, -0.7, -Inf, 8.0 ]

        - type: box-shadow
          bounds: [ 320, 20, 80, 80 ]
          color: blue
          clip-mode: inset
          spread-radius: 10
          border-radius: [ 4, 4, 4, 4, 1.2, -0.7, -Inf, 8.0 ]
